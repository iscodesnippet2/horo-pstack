# Build one pstack commit as horo-pstack and publish it.
#
#   cursor/plugins@commit  ──vendor──▶  wheel + SBOM  ──▶  verify next to each horo-next
#   ──▶  TestPyPI  ──▶  (approval)  ──▶  PyPI + GitHub release
#
# pstack content is never committed to this repository. Each run checks out the
# commit fresh, so a release is a pure function of (pstack commit, this repo).
#
# Publishing uses PyPI Trusted Publishing: no API token is stored here.
name: release

on:
  workflow_dispatch:
    inputs:
      pstack_commit:
        description: "cursor/plugins commit (40-character SHA) to package"
        required: true
      post:
        description: "Post-release number when only this packaging changed (blank for none)"
        required: false
        default: ""
      horo_next_versions:
        description: "horo-next versions on PyPI to verify against, as a JSON list"
        required: true
        default: '["0.21.5"]'
      publish:
        description: "Publish after verification (false = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.pstack_commit }}-${{ inputs.post }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check out the pstack commit
        run: |
          [[ "${{ inputs.pstack_commit }}" =~ ^[0-9a-f]{40}$ ]] || { echo "pstack_commit must be a full SHA"; exit 1; }
          git clone --filter=blob:none --no-checkout https://github.com/cursor/plugins.git cursor-plugins
          git -C cursor-plugins checkout --quiet "${{ inputs.pstack_commit }}"

      - name: Vendor the skills
        run: python3 vendor.py cursor-plugins ${{ inputs.post }}

      - id: meta
        run: echo "version=$(python3 -c 'exec(open("src/horo_pstack/_version.py").read()); print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Generate and embed the SBOM (PEP 770)
        run: |
          v="${{ steps.meta.outputs.version }}"
          python3 sbom.py generate horo-pstack.cdx.json
          python3 sbom.py embed "dist/horo_pstack-$v-py3-none-any.whl" horo-pstack.cdx.json "horo-pstack-$v.cdx.json"
          uv run --with 'cyclonedx-python-lib[json-validation]==11.12.0' python -c "
          import sys
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator
          v = JsonStrictValidator(SchemaVersion.V1_5)
          for f in sys.argv[1:]:
              err = v.validate_str(open(f).read())
              sys.exit(f'{f}: invalid CycloneDX 1.5: {err}') if err else print(f, 'valid CycloneDX 1.5')
          " horo-pstack.cdx.json "horo-pstack-$v.cdx.json"

      - name: Release notes
        run: |
          python3 - <<'EOF' > release-notes.md
          import json
          up = json.load(open("src/horo_pstack/_vendor/UPSTREAM.json"))
          print(f"pstack {up['version']} from {up['repository']}/tree/{up['commit']}/{up['path']}\n")
          print(f"Ships {len(up['skills'])} skills as `pstack:<name>`, plus `pstack:hermes-harness`.\n")
          print("Left out:\n")
          for name, why in sorted(up["excluded"].items()):
              print(f"- `{name}`: {why}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
            horo-pstack-${{ steps.meta.outputs.version }}.cdx.json
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        horo_next: ${{ fromJson(inputs.horo_next_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Install next to horo-next ${{ matrix.horo_next }} and check it works
        run: |
          python3 verify_wheel.py "dist/horo_pstack-${{ needs.build.outputs.version }}-py3-none-any.whl" \
            3.12 "${{ matrix.horo_next }}"

  testpypi:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      # skip-existing: a re-run after a rejected PyPI step must reach that step again.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # The `pypi` environment requires a reviewer (repository settings). A version
  # uploaded to PyPI can never be uploaded again, even if deleted.
  pypi:
    if: inputs.publish
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          gh release create "v$v" --repo "${{ github.repository }}" \
            --title "horo-pstack $v (pstack @ ${{ inputs.pstack_commit }})" \
            --notes-file release-notes.md dist/*.whl "horo-pstack-$v.cdx.json"
